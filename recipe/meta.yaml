{% set name = "python-slugify" %}
{% set version = "9.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name|replace("-", "_") }}/{{ name|replace("-", "_") }}-{{ version }}.tar.gz
  sha256: 3f02e8a0639c61e37eca5a783aae09112796d15d331ee3d5372241b61ee05f1c

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - slugify=slugify.__main__:main
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - setuptools >=77
  run:
    - python
    - text-unidecode >=1.3
  run_constrained:
    - unidecode >=1.1.1
    - anyascii >=0.3.2

test:
  requires:
    - pip
    - pytest >=8
  imports:
    - slugify
  source_files:
    - tests
    - tools
    - README.md
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - slugify --help
    - python -m pytest -v tests

about:
  home: https://github.com/un33k/python-slugify
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A Python Slugify application that handles Unicode
  description: A Python slugify application that handles unicode.
  dev_url: https://github.com/un33k/python-slugify
  doc_url: https://github.com/un33k/python-slugify/blob/master/README.md

extra:
  recipe-maintainers:
    - proinsias
    - sodre
    - bollwyvl